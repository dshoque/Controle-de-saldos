<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Controle de Saldos ARP{% endblock %} · CEFET/RJ</title>
<style>
    :root {
        --azul: #003580; --azul-claro: #e8f0fb; --verde: #1e7e34; --verde-bg: #d4edda;
        --vermelho: #a71d2a; --vermelho-bg: #f8d7da; --cinza: #6c757d; --cinza-bg: #e9ecef;
        --borda: #dee2e6;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    header { background: var(--azul); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 18px; margin: 0; }
    nav a { color: #fff; text-decoration: none; margin-right: 18px; font-size: 14px; opacity: .9; }
    nav a.ativo, nav a:hover { opacity: 1; text-decoration: underline; }
    main { padding: 22px 28px; max-width: 1400px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--borda); text-align: left; }
    th { background: var(--azul-claro); color: var(--azul); font-weight: 600; position: sticky; top: 0; }
    tr:hover td { background: #fafbfd; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    input, select, textarea { padding: 7px 9px; border: 1px solid #c7ccd1; border-radius: 5px; font-size: 13.5px; }
    button, .btn { background: var(--azul); color: #fff; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 13.5px; text-decoration: none; display: inline-block; }
    button:hover, .btn:hover { background: #002a63; }
    button.secundario, .btn.secundario { background: var(--cinza); }
    button.perigo, .btn.perigo { background: var(--vermelho); }
    .badge { padding: 3px 9px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-ok { background: var(--verde-bg); color: var(--verde); }
    .badge-erro { background: var(--vermelho-bg); color: var(--vermelho); }
    .badge-neutro { background: var(--cinza-bg); color: var(--cinza); }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
    .flash-sucesso { background: var(--verde-bg); color: var(--verde); }
    .flash-erro { background: var(--vermelho-bg); color: var(--vermelho); }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .stat { text-align: center; }
    .stat .valor { font-size: 26px; font-weight: 700; color: var(--azul); }
    .stat .rotulo { font-size: 12.5px; color: var(--cinza); }
    form.inline { display: inline; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    small.ajuda { color: var(--cinza); display: block; margin-top: 4px; }
</style>
</head>
<body>
<header>
    <h1>Controle de Saldos ARP — CEFET/RJ (UASG 153010)</h1>
    <nav>
        <a href="{{ url_for('dashboard') }}" class="{{ 'ativo' if request.endpoint=='dashboard' }}">Saldos</a>
        <a href="{{ url_for('planejamento') }}" class="{{ 'ativo' if request.endpoint=='planejamento' }}">Planejamento</a>
        <a href="{{ url_for('novo_pedido_form') }}" class="{{ 'ativo' if request.endpoint and 'novo_pedido' in request.endpoint }}">Novo Pedido</a>
        <a href="{{ url_for('pedidos') }}" class="{{ 'ativo' if request.endpoint=='pedidos' }}">Pedidos</a>
        <a href="{{ url_for('conferencia') }}" class="{{ 'ativo' if request.endpoint=='conferencia' }}">Conferência API</a>
        <a href="{{ url_for('manutencao') }}" class="{{ 'ativo' if request.endpoint and 'manutencao' in request.endpoint }}">Manutenção</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline" style="margin-left:8px;">
            <button type="submit" class="secundario" style="padding:4px 10px; font-size:12.5px;">Sair</button>
        </form>
    </nav>
</header>
<main>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, msg in mensagens %}
            <div class="flash flash-{{ categoria }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
