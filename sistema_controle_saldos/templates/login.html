<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Controle de Saldos ARP</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 28px; width: 320px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    h1 { font-size: 17px; color: #003580; margin: 0 0 18px; }
    input { width: 100%; padding: 9px; border: 1px solid #c7ccd1; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; margin-top: 14px; background: #003580; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    button:hover { background: #002a63; }
    .erro { background: #f8d7da; color: #a71d2a; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
    <div class="card">
        <h1>Controle de Saldos ARP — DIARP</h1>
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
        <form method="post">
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <label>Senha da equipe</label>
            <input type="password" name="senha" autofocus required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
